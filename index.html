<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聖德安座設壇 · 電子打卡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { height: 100%; }

  body {
    overflow: hidden;
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", "楷體", "SimSun", "宋體", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #f5e8d0;
    color: #5c3a1f;
    /* 手机触摸优化 */
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }

  /* 🏔 背景 */
  #landscape { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #landscape .painting {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 1;
    animation: paintingBreath 60s ease-in-out infinite alternate;
  }
  @keyframes paintingBreath {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.03) translate(-0.5%, -0.5%); }
  }

  /* 金粉 + 朱紅光點 */
  #goldDust { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .dust {
    position: absolute; top: -20px; border-radius: 50%;
    animation: fall linear infinite; opacity: 0;
  }
  .dust.gold {
    width: 5px; height: 5px;
    background: radial-gradient(circle, #fff1c9 0%, #e0be62 45%, rgba(200, 162, 60, 0) 70%);
    box-shadow: 0 0 6px rgba(220, 190, 100, 0.8);
  }
  .dust.red {
    width: 4px; height: 4px;
    background: radial-gradient(circle, #ffd0b0 0%, #d44a2a 45%, rgba(180, 50, 20, 0) 70%);
    box-shadow: 0 0 5px rgba(212, 74, 42, 0.6);
  }
  @keyframes fall {
    0% { transform: translateY(-20px) translateX(0) scale(0.6); opacity: 0; }
    15% { opacity: 0.7; } 85% { opacity: 0.5; }
    100% { transform: translateY(110vh) translateX(var(--drift, 20px)) scale(1); opacity: 0; }
  }

  /* ===== 第一頁 ===== */
  #welcome {
    position: relative;
    z-index: 10;
    text-align: center;
    width: 100%;
    padding: 20px;                              /* 手机边缘留白 */
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* 米色半透明框 */
  #welcome .title-box {
    display: inline-block;
    width: 90vw;                                /* 手机屏幕的 90% 宽 */
    max-width: 440px;                           /* 平板/电脑上不要太大 */
    padding: 8vw 6vw;                           /* 内边距用 vw，随屏幕缩放 */
    background: linear-gradient(160deg,
      rgba(255, 245, 224, 0.82) 0%,
      rgba(248, 233, 200, 0.75) 55%,
      rgba(238, 212, 168, 0.7) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(200, 168, 74, 0.7),
      0 0 0 4px rgba(255, 245, 224, 0.5),
      0 0 0 5px rgba(168, 50, 31, 0.3),
      0 12px 30px rgba(90, 45, 20, 0.3),
      0 0 40px rgba(200, 168, 74, 0.25);
  }

  /* 「歡迎蒞臨」 */
  #welcome .title {
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);      /* 手机自适应 */
    font-weight: 600;
    color: #a8321f;
    letter-spacing: 0.6em;                      /* 用 em 而不是 px，随字号缩放 */
    margin-bottom: 0.4em;
    padding-left: 0.6em;                        /* 补偿字间距 */
    text-shadow:
      0 1px 3px rgba(255, 255, 255, 1),
      0 0 15px rgba(255, 255, 255, 0.9),
      0 2px 8px rgba(140, 40, 20, 0.3);
  }

  /* 「聖德安座設壇」—— 比欢迎莅临大 */
  #welcome .subtitle {
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(2rem, 8.5vw, 3.2rem);      /* 手机更大 */
    font-weight: 700;
    color: #6e3a18;
    letter-spacing: 0.35em;
    margin-bottom: 1.2em;
    padding-left: 0.35em;
    line-height: 1.2;
    text-shadow:
      0 1px 3px rgba(255, 255, 255, 1),
      0 0 15px rgba(255, 255, 255, 0.95),
      0 2px 8px rgba(110, 60, 20, 0.4);
  }

  /* 打卡按钮 */
  #welcome .checkin-btn {
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(1.1rem, 4.5vw, 1.5rem);
    font-weight: 500;
    color: #fff5e0;
    letter-spacing: 0.5em;
    padding: 0.9em 2em 0.9em 2.5em;            /* 右侧多留，因为字间距 */
    width: 100%;
    max-width: 320px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: linear-gradient(160deg, #c8a84a, #a8321f);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    box-shadow:
      0 0 0 2px rgba(255, 245, 224, 0.9),
      0 0 0 4px rgba(200, 168, 74, 0.6),
      0 8px 22px rgba(140, 40, 20, 0.35),
      inset 0 1px 0 rgba(255, 240, 200, 0.6),
      inset 0 -1px 0 rgba(80, 20, 10, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    /* 手机触摸优化 */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #welcome .checkin-btn:active {
    transform: translateY(2px) scale(0.98);
    box-shadow:
      0 0 0 2px rgba(255, 245, 224, 1),
      0 0 0 4px rgba(200, 168, 74, 0.85),
      0 4px 12px rgba(140, 40, 20, 0.35),
      inset 0 1px 0 rgba(255, 240, 200, 0.7),
      inset 0 -1px 0 rgba(80, 20, 10, 0.35);
  }

  /* ===== 邀請函彈窗 ===== */
  #invitation {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;                              /* 手机边缘留白 */
    background: transparent;
    opacity: 0;
    transition: opacity 0.6s ease;
    overflow-y: auto;
  }
  #invitation.show {
    display: flex;
    opacity: 1;
  }

  .invite-card {
    position: relative;
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    padding: 8vw 6vw 6vw;
    border-radius: 12px;
    text-align: center;
    background: linear-gradient(160deg,
      rgba(255, 245, 224, 0.85) 0%,
      rgba(248, 233, 200, 0.78) 55%,
      rgba(238, 212, 168, 0.75) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      0 0 0 1px rgba(200, 168, 74, 0.8),
      0 0 0 5px rgba(255, 245, 224, 0.5),
      0 0 0 6px rgba(168, 50, 31, 0.35),
      0 18px 45px rgba(90, 45, 20, 0.45),
      0 0 60px rgba(200, 168, 74, 0.3),
      inset 0 0 50px rgba(220, 195, 140, 0.2);
    transform: scale(0.85) translateY(30px);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #invitation.show .invite-card {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .invite-card::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(200, 168, 74, 0.55);
    pointer-events: none;
    border-radius: 6px;
  }

  .invite-card .deco-line {
    width: 70%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #a8321f, #d8b968, #a8321f, transparent);
    margin: 1em auto 1.4em;
    box-shadow: 0 0 6px rgba(168, 50, 31, 0.4);
  }

  .invite-title {
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(1.4rem, 5.5vw, 1.9rem);
    font-weight: 600;
    color: #a8321f;
    letter-spacing: 0.35em;
    line-height: 1.5;
    text-shadow:
      0 1px 3px rgba(255, 245, 224, 1),
      0 0 12px rgba(255, 245, 224, 0.7),
      0 2px 5px rgba(140, 40, 20, 0.25);
  }

  .invite-form { text-align: left; margin-top: 6px; }
  .invite-form label {
    display: block;
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(0.9rem, 3.4vw, 1.05rem);
    font-weight: 500;
    color: #8b5a2e;
    letter-spacing: 0.4em;
    margin-bottom: 0.5em;
    margin-left: 4px;
  }
  .invite-form input,
  .invite-form textarea {
    width: 100%;
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(1rem, 3.8vw, 1.15rem);
    color: #5c3a1f;
    padding: 0.8em 1em;
    border: 1px solid rgba(200, 168, 74, 0.7);
    border-radius: 6px;
    background: rgba(255, 250, 235, 0.9);
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    letter-spacing: 0.1em;
    /* 手机输入优化 */
    -webkit-appearance: none;
    appearance: none;
  }
  .invite-form input:focus,
  .invite-form textarea:focus {
    border-color: #a8321f;
    background: #fffaf0;
    box-shadow: 0 0 0 3px rgba(168, 50, 31, 0.12), 0 0 12px rgba(200, 168, 74, 0.3);
  }
  .invite-form textarea {
    min-height: 80px;
    resize: vertical;
    line-height: 1.5;
  }
  .invite-form .field { margin-bottom: 1.2em; }

  .submit-btn {
    display: block;
    width: 100%;
    margin-top: 0.5em;
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(1rem, 4vw, 1.15rem);
    font-weight: 500;
    color: #fff5e0;
    letter-spacing: 0.5em;
    padding: 0.85em 0.5em 0.85em 1em;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: linear-gradient(160deg, #c8a84a, #a8321f);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    box-shadow:
      0 0 0 1px rgba(255, 245, 224, 0.9),
      0 0 0 3px rgba(200, 168, 74, 0.5),
      0 5px 14px rgba(140, 40, 20, 0.35),
      inset 0 1px 0 rgba(255, 240, 200, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .submit-btn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow:
      0 0 0 1px rgba(255, 245, 224, 1),
      0 0 0 3px rgba(200, 168, 74, 0.7),
      0 3px 10px rgba(140, 40, 20, 0.4),
      inset 0 1px 0 rgba(255, 240, 200, 0.6);
  }
  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .thank-you {
    display: none;
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    color: #a8321f;
    text-align: center;
    padding: 1.5em 0;
    animation: fadeIn 0.8s ease;
  }
  .thank-you.show { display: block; }
  .thank-you .big {
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(1.5rem, 6vw, 2rem);
    font-weight: 600;
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    color: #a8321f;
    margin-bottom: 0.5em;
    text-shadow:
      0 1px 3px rgba(255, 245, 224, 1),
      0 0 12px rgba(255, 245, 224, 0.7),
      0 2px 5px rgba(140, 40, 20, 0.25);
  }
  .thank-you .small {
    font-family: "Noto Serif TC", "STKaiti", "KaiTi", serif;
    font-size: clamp(0.85rem, 3.4vw, 1rem);
    font-weight: 400;
    color: #8b5a2e;
    letter-spacing: 0.3em;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    width: 38px; height: 38px;
    font-size: 1rem;
    color: #a8321f;
    background: rgba(255, 245, 224, 0.7);
    border: 1px solid rgba(168, 50, 31, 0.5);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .close-btn:active {
    color: #fff5e0;
    background: #a8321f;
    border-color: #a8321f;
    transform: scale(0.95);
  }

  /* 横屏时缩小内边距 */
  @media (orientation: landscape) and (max-height: 500px) {
    #welcome .title-box {
      padding: 4vw 6vw;
    }
    #welcome .subtitle {
      margin-bottom: 0.8em;
    }
    .invite-card {
      padding: 4vw 6vw;
      max-height: 94vh;
    }
  }
</style>
</head>
<body>

<div id="landscape">
  <img class="painting" src="background.gif" alt="山水畫">
</div>

<div id="goldDust"></div>

<!-- 第一頁 -->
<div id="welcome">
  <div class="title-box">
    <div class="title">歡迎蒞臨</div>
    <div class="subtitle">聖德安座設壇</div>
    <button class="checkin-btn" id="checkinBtn">點 擊 打 卡</button>
  </div>
</div>

<!-- 邀請函 -->
<div id="invitation">
  <div class="invite-card">
    <button class="close-btn" id="closeBtn">✕</button>

    <div class="invite-title">歡迎蒞臨<br>聖德安座設壇</div>
    <div class="deco-line"></div>

    <form class="invite-form" id="inviteForm">
      <div class="field">
        <label for="nameInput">姓 名</label>
        <input type="text" id="nameInput" placeholder="請輸入您的姓名" required maxlength="20">
      </div>
      <div class="field">
        <label for="msgInput">祝 福</label>
        <textarea id="msgInput" placeholder="請輸入您的祝福" required maxlength="200"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">送 出 祝 福</button>
    </form>

    <div class="thank-you" id="thankYou">
      <div class="big">感 恩 有 您</div>
      <div class="small">您的祝福已收到，謝謝蒞臨</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyB8qh5Yrem1ZsaT8VogIlLUHsaZSjkjOu18tCqGuztY45uIlAPJUmPmtfDEtytbjW7WQ/exec";

  (function createDust() {
    const container = document.getElementById("goldDust");
    const COUNT = 22;
    for (let i = 0; i < COUNT; i++) {
      const d = document.createElement("div");
      d.className = "dust " + (i % 3 === 0 ? "red" : "gold");
      d.style.left = Math.random() * 100 + "vw";
      d.style.animationDuration = (14 + Math.random() * 14) + "s";
      d.style.animationDelay = (-Math.random() * 25) + "s";
      d.style.setProperty("--drift", ((Math.random() - 0.5) * 90) + "px");
      container.appendChild(d);
    }
  })();

  const welcome    = document.getElementById("welcome");
  const invitation = document.getElementById("invitation");
  const checkinBtn = document.getElementById("checkinBtn");
  const closeBtn   = document.getElementById("closeBtn");
  const inviteForm = document.getElementById("inviteForm");
  const submitBtn  = document.getElementById("submitBtn");
  const thankYou   = document.getElementById("thankYou");
  const nameInput  = document.getElementById("nameInput");
  const msgInput   = document.getElementById("msgInput");

  checkinBtn.addEventListener("click", () => {
    welcome.style.opacity = "0";
    welcome.style.transform = "scale(0.98)";
    setTimeout(() => {
      welcome.style.display = "none";
      invitation.classList.add("show");
    }, 400);
  });

  closeBtn.addEventListener("click", () => {
    invitation.classList.remove("show");
    setTimeout(() => {
      welcome.style.display = "block";
      welcome.style.opacity = "1";
      welcome.style.transform = "scale(1)";
    }, 400);
  });

  inviteForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const msg  = msgInput.value.trim();
    if (!name || !msg) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "傳 送 中...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ name, msg })
      });
      const json = await res.json();
      if (json.ok) {
        inviteForm.style.display = "none";
        thankYou.classList.add("show");
        setTimeout(() => {
          invitation.classList.remove("show");
          setTimeout(() => {
            welcome.style.display = "block";
            welcome.style.opacity = "1";
            welcome.style.transform = "scale(1)";
            inviteForm.reset();
            inviteForm.style.display = "block";
            thankYou.classList.remove("show");
            submitBtn.disabled = false;
            submitBtn.textContent = "送 出 祝 福";
          }, 400);
        }, 3000);
      } else {
        alert("送出失敗，請再試一次。");
        submitBtn.disabled = false;
        submitBtn.textContent = "送 出 祝 福";
      }
    } catch (err) {
      console.error(err);
      alert("網路錯誤，請再試一次。");
      submitBtn.disabled = false;
      submitBtn.textContent = "送 出 祝 福";
    }
  });
</script>

</body>
</html>
